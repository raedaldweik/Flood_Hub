[project]
name = "sadd-backend"
version = "0.1.0"
description = "PROJECT SADD — FastAPI backend: api / rules / sim / models / agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "xgboost-cpu>=2.1",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Phase 2 adds: xgboost, scikit-learn, joblib   (models/)
# Phase 3 adds: google-adk, google-genai, mcp    (agent/, flood-forecasting-mcp)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sadd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
